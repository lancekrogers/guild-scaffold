# Go Library template for testing
_scaffold_version: "1.0.0"
_templates_dir: "templates/library"

_vars:
  package_name: "testlib"
  module_name: "github.com/example/library"

pkg/:
  testlib/:
    _files:
      testlib.go: lib.go.tmpl
      testlib_test.go: lib_test.go.tmpl

examples/:
  basic/:
    _files:
      main.go: examples/basic.go.tmpl

docs/:
  _files:
    README.md: docs/readme.md.tmpl

_files:
  go.mod: go.mod.tmpl
  README.md: readme.md.tmpl
