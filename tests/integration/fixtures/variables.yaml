# Test for variable substitution
_scaffold_version: "1.0.0"
_templates_dir: "templates/variables"

_vars:
  string_var: "default"
  int_var: "0"
  bool_var: "false"
  special_chars: "none"
  list_var: ""

# Directory structure triggers tree format detection
config/:
  _files:
    config.yaml: config/config.yaml.tmpl

# Root-level files use direct mapping
README.md: README.md.tmpl
