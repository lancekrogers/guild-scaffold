name: guild-campaign
version: "1.0.0"
description: "Complete campaign workspace with guild configuration"

templates_dir: templates

variables:
  campaign_name:
    type: string
    required: true
    description: "Name of the campaign (used as identifier)"
    pattern: "^[a-zA-Z0-9_-]+$"

  description:
    type: string
    required: false
    default: "A Guild AI agent campaign"
    description: "Human-readable description of the campaign"

  author:
    type: string
    required: false
    description: "Primary author or team name"

  guild_name:
    type: string
    required: false
    description: "Name of the primary guild (defaults to campaign_name)"

  provider:
    type: string
    required: false
    default: "anthropic"
    enum: ["anthropic", "openai", "ollama"]
    description: "Default AI provider for agents"

  model:
    type: string
    required: false
    default: "claude-3-sonnet-20240229"
    description: "Default model for agents"

tree:
  .campaign/:
    campaign.yaml: campaign.yaml.tmpl
    guilds/:
      _empty: true
    agents/:
      _empty: true
    archives/:
      _empty: true
    prompts/:
      _empty: true
  commissions/:
    _empty: true
  corpus/:
    _empty: true
  kanban/:
    todo/:
      _empty: true
    in-progress/:
      _empty: true
    done/:
      _empty: true
  README.md: README.md.tmpl
